<!doctype html>
<meta charset="utf-8">
<title>Stabilo browser smoke test</title>
<link rel="stylesheet" href="../content.css">
<p id="article">An unfamiliar <strong>expression</strong> becomes clearer with context.</p>
<textarea id="editable">Do not highlight this field.</textarea>
<pre id="results">Running…</pre>
<script src="../content.js"></script>
<script src="../content.js"></script>
<script>
(async () => {
  const results = document.getElementById('results');
  const passed = [];
  function check(condition, label) {
    if (!condition) throw new Error(label);
    passed.push(label);
  }
  const tick = () => new Promise(resolve => setTimeout(resolve, 20));
  try {
    const hosts = [...document.querySelectorAll('div')].filter(el => el.shadowRoot);
    check(hosts.length === 1, 'Repeated activation has one UI');
    const ui = hosts[0].shadowRoot;
    const article = document.getElementById('article');
    const original = article.innerHTML;
    const range = document.createRange();
    range.setStart(article.firstChild, 3);
    range.setEnd(article.lastChild, 15);
    const selection = getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    article.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
    await tick();
    check(!ui.getElementById('selection').hidden, 'Selection offers a highlight');
    check(ui.getElementById('highlight').getBoundingClientRect().width === 30, 'Marker control is compact');
    check(ui.getElementById('highlight').getAttribute('aria-label') === 'Highlight selection', 'Marker has an accessible label');
    ui.getElementById('highlight').click();
    const paint = CSS.highlights.get('stabilo-selection');
    check(paint.size === 1, 'Cross-element range is highlighted');
    check(article.innerHTML === original, 'Article markup remains unchanged');

    article.addEventListener('click', event => event.stopPropagation());
    function openNote() {
      const rect = [...paint][0].getClientRects()[0];
      article.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: rect.left + 2, clientY: rect.top + 2 }));
    }
    openNote();
    check(!ui.getElementById('editor').hidden, 'Clicking a highlight opens the note');
    const note = ui.getElementById('note');
    note.value = 'A simpler explanation <script> stays plain text';
    note.dispatchEvent(new Event('input'));
    ui.getElementById('done').click();
    openNote();
    check(note.value === 'A simpler explanation <script> stays plain text', 'Note survives closing and reopening');
    ui.getElementById('remove').click();
    check(paint.size === 0, 'Removing a highlight clears its range');
    check(article.innerHTML === original, 'Removal preserves article markup');

    // Realistic pointer sequence, including events crossing the shadow boundary.
    async function selectPassage(candidate) {
      article.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
      selection.removeAllRanges();
      selection.addRange(candidate);
      article.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
      await tick();
    }
    function pressMarker() {
      const button = ui.getElementById('highlight');
      button.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, composed: true, cancelable: true }));
      button.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, composed: true }));
      button.click();
    }
    await selectPassage(range.cloneRange());
    pressMarker();
    check(paint.size === 1, 'Pointer interaction creates a highlight');
    await selectPassage(range.cloneRange());
    check(ui.getElementById('highlight').getAttribute('aria-label') === 'Remove highlight', 'Reselecting offers an eraser');
    pressMarker();
    check(paint.size === 0, 'Reselecting removes instead of stacking highlights');
    await selectPassage(range.cloneRange());
    pressMarker();
    const word = document.createRange();
    word.selectNodeContents(article.querySelector('strong'));
    await selectPassage(word);
    pressMarker();
    check(paint.size === 0, 'Selecting a word inside a highlight removes the whole highlight');

    function key(target, key, extra = {}) {
      const event = new KeyboardEvent('keydown', { key, bubbles: true, composed: true, cancelable: true, ...extra });
      target.dispatchEvent(event);
      return event;
    }
    await selectPassage(range.cloneRange());
    key(article, 'Tab');
    check(ui.activeElement === ui.getElementById('highlight'), 'Tab reaches the selection control');
    ui.getElementById('highlight').click();
    check(paint.size === 1 && document.activeElement === article, 'Highlight activation restores reading focus');
    check(ui.getElementById('status').textContent.includes('added'), 'Highlight creation has a live announcement');
    key(article, 'N', { code: 'KeyN', altKey: true, shiftKey: true });
    check(ui.activeElement === note, 'Keyboard shortcut opens an existing note');
    check(ui.getElementById('quote').textContent.includes('expression'), 'Note dialog describes the highlighted passage');
    check(ui.getElementById('remove').getBoundingClientRect().width >= 24 && ui.getElementById('remove').getBoundingClientRect().height >= 24, 'Eraser keeps a minimum 24px target');
    check(getComputedStyle(ui.getElementById('selection')).overflow !== 'hidden', 'Marker focus outline is not clipped');
    if (matchMedia('(forced-colors: active)').matches) {
      check(getComputedStyle(ui.getElementById('remove')).borderTopStyle === 'solid', 'High contrast retains a visible control border');
    }
    check(note.getAttribute('aria-describedby') === 'note-hint', 'Note is linked to its lifetime description');
    key(note, 'Escape');
    check(ui.getElementById('editor').hidden && document.activeElement === article, 'Escape closes the editor and restores focus');
    key(article, 'N', { code: 'KeyN', altKey: true, shiftKey: true });
    ui.getElementById('remove').focus();
    ui.getElementById('remove').click();
    check(paint.size === 0 && document.activeElement === article, 'Removal returns keyboard focus to the article');
    check(ui.getElementById('status').textContent.includes('removed'), 'Removal has a live announcement');
    await selectPassage(range.cloneRange());
    key(article, 'H', { code: 'KeyH', altKey: true, shiftKey: true });
    check(paint.size === 1, 'Highlight shortcut adds a highlight');
    key(article, 'N', { code: 'KeyN', altKey: true, shiftKey: true });
    note.value = 'Keep this note';
    note.dispatchEvent(new Event('input'));
    document.getElementById('editable').focus();
    await tick();
    check(ui.getElementById('editor').hidden, 'Moving focus outside dismisses the non-modal editor');
    article.focus();
    key(article, 'N', { code: 'KeyN', altKey: true, shiftKey: true });
    check(note.value === 'Keep this note', 'Leaving the editor preserves the note');
    check(!key(note, 'Tab').defaultPrevented, 'Editor does not trap Tab');
    key(note, 'Escape');
    await selectPassage(range.cloneRange());
    key(article, 'H', { code: 'KeyH', altKey: true, shiftKey: true });
    check(paint.size === 0, 'Highlight shortcut removes an existing highlight');
    key(article, 'N', { code: 'KeyN', altKey: true, shiftKey: true });
    check(ui.getElementById('status').textContent.includes('No highlights'), 'Empty highlight navigation is announced');

    const editable = document.getElementById('editable');
    editable.focus();
    editable.select();
    check(!key(editable, 'H', { code: 'KeyH', altKey: true, shiftKey: true }).defaultPrevented, 'Shortcuts do not intercept typing in fields');
    editable.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
    await tick();
    check(ui.getElementById('selection').hidden, 'Editable text does not offer highlighting');
    results.textContent = 'PASS: ' + passed.join('\nPASS: ');
    document.title = 'PASS';
  } catch (error) {
    results.textContent = 'FAIL: ' + error.message + '\n' + passed.join('\n');
    document.title = 'FAIL';
  }
})();
</script>
